<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="300" rx="24" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="600" y="48" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">Three questions every principal asks. Three answers on one screen.</text>

  <!-- card 1 -->
  <g transform="translate(48,80)">
    <rect width="352" height="180" rx="16" fill="#ffffff" stroke="#e1e0d9"/>
    <rect x="24" y="24" width="48" height="48" rx="12" fill="#f8d4d4"/>
    <text x="48" y="57" font-size="26" text-anchor="middle" fill="#d03b3b">?</text>
    <text x="88" y="44" font-size="17" font-weight="700" fill="#0b0b0b">"Who hasn't paid?"</text>
    <text x="88" y="66" font-size="14" fill="#52514e">Not the register. Not the receipt book.</text>
    <line x1="24" y1="92" x2="328" y2="92" stroke="#e1e0d9"/>
    <text x="24" y="122" font-size="15" font-weight="700" fill="#006300">Open the app. Owing families are red.</text>
    <text x="24" y="146" font-size="14" fill="#52514e">With the amount, on every list, every day.</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(424,80)">
    <rect width="352" height="180" rx="16" fill="#ffffff" stroke="#e1e0d9"/>
    <rect x="24" y="24" width="48" height="48" rx="12" fill="#fde9c8"/>
    <text x="48" y="57" font-size="26" text-anchor="middle" fill="#eb6834">≠</text>
    <text x="88" y="44" font-size="17" font-weight="700" fill="#0b0b0b">"The totals don't match."</text>
    <text x="88" y="66" font-size="14" fill="#52514e">Register, receipts and bank all differ.</text>
    <line x1="24" y1="92" x2="328" y2="92" stroke="#e1e0d9"/>
    <text x="24" y="122" font-size="15" font-weight="700" fill="#006300">One ledger. Every rupee once.</text>
    <text x="24" y="146" font-size="14" fill="#52514e">Statements and totals are always the sum of it.</text>
  </g>

  <!-- card 3 -->
  <g transform="translate(800,80)">
    <rect width="352" height="180" rx="16" fill="#ffffff" stroke="#e1e0d9"/>
    <rect x="24" y="24" width="48" height="48" rx="12" fill="#cde2fb"/>
    <text x="48" y="57" font-size="24" text-anchor="middle" fill="#2a78d6">Rs</text>
    <text x="88" y="44" font-size="17" font-weight="700" fill="#0b0b0b">"Software costs too much."</text>
    <text x="88" y="66" font-size="14" fill="#52514e">Priced per student, built for big schools.</text>
    <line x1="24" y1="92" x2="328" y2="92" stroke="#e1e0d9"/>
    <text x="24" y="122" font-size="15" font-weight="700" fill="#006300">Rs 2,000 a month. Or free, self-hosted.</text>
    <text x="24" y="146" font-size="14" fill="#52514e">Same price for 50 students or 500.</text>
  </g>
</svg>
