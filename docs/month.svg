<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="250" rx="24" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="600" y="46" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">A month in ilmsoft</text>

  <!-- connector -->
  <line x1="150" y1="130" x2="1050" y2="130" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- step 1 -->
  <g transform="translate(150,130)">
    <circle r="40" fill="#2a78d6"/>
    <text y="8" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text y="70" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">Generate the month</text>
    <text y="92" font-size="13" fill="#52514e" text-anchor="middle">One click. Class fee minus each</text>
    <text y="110" font-size="13" fill="#52514e" text-anchor="middle">child's discount, for every family.</text>
  </g>

  <!-- step 2 -->
  <g transform="translate(450,130)">
    <circle r="40" fill="#1baf7a"/>
    <text y="8" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text y="70" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">Collect at the desk</text>
    <text y="92" font-size="13" fill="#52514e" text-anchor="middle">Record the payment, print the</text>
    <text y="110" font-size="13" fill="#52514e" text-anchor="middle">receipt. Oldest month is cleared first.</text>
  </g>

  <!-- step 3 -->
  <g transform="translate(750,130)">
    <circle r="40" fill="#d03b3b"/>
    <text y="8" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text y="70" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">See who still owes</text>
    <text y="92" font-size="13" fill="#52514e" text-anchor="middle">Red names, amounts, one tap to</text>
    <text y="110" font-size="13" fill="#52514e" text-anchor="middle">call, collect or print the statement.</text>
  </g>

  <!-- step 4 -->
  <g transform="translate(1050,130)">
    <circle r="40" fill="#eda100"/>
    <text y="8" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text y="70" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">Close the month</text>
    <text y="92" font-size="13" fill="#52514e" text-anchor="middle">Billed, collected, receivables and</text>
    <text y="110" font-size="13" fill="#52514e" text-anchor="middle">expenses. No spreadsheet needed.</text>
  </g>
</svg>
